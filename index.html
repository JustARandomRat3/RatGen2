<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RatGen, Just generate the image already</title>

  <style>
    body {
      background: #0a0a0a;
      color: #bfa06a;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    a.button {
      background: #bfa06a;
      color: #0a0a0a;
      padding: 0.9rem 1.7rem;
      border-radius: 0.4rem;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin: 1rem 0;
      transition: 0.2s;
    }

    a.button:hover {
      background: #fff2a8;
      transform: scale(1.05);
    }

    textarea {
      width: 80%;
      max-width: 550px;
      padding: 0.7rem;
      margin: 0.5rem 0;
      border: 2px solid #bfa06a;
      background: #111;
      color: #bfa06a;
      border-radius: 0.4rem;
      font-size: 1rem;
    }

    #result img {
      max-width: 90%;
      margin-top: 1.5rem;
      border: 4px solid #bfa06a;
      border-radius: 0.5rem;
      box-shadow: 0 0 20px #ffd70055;
    }

    #loading {
      display: none;
      margin-top: 1rem;
      font-size: 1.2rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>RatGen</h1>

  <a id="authBtn" class="button" href="#">
    Connect Your Pollinations Account
  </a>

  <div id="promptSection" style="display: none;">
    <textarea
      id="prompt"
      rows="2"
      placeholder="Describe the image you want…"
    ></textarea>
    <br>
    <a id="generateBtn" class="button" href="#">Generate Image</a>
    <div id="loading">Generating… please wait</div>
  </div>

  <div id="result"></div>

  <script>
    const CLIENT_ID = "pk_3nQsoQyCywMClyjt";
    const REDIRECT_URI = "https://justarandomrat3.github.io/RatGen2/";

    const authUrl = new URL("https://enter.pollinations.ai/authorize");
    authUrl.searchParams.set("redirect_url", REDIRECT_URI);
    authUrl.searchParams.set("client_id", CLIENT_ID);

    const authBtn = document.getElementById("authBtn");
    const promptSection = document.getElementById("promptSection");
    const generateBtn = document.getElementById("generateBtn");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");
    const historyList = document.getElementById("history");
    const clearHistoryBtn = document.getElementById("clearHistory");

    const HISTORY_KEY = "ratgen-prompt-history";
    const MAX_HISTORY = 20;

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function renderHistory() {
      historyList.replaceChildren();

      for (const promptText of getHistory()) {
        const item = document.createElement("li");
        const button = document.createElement("button");

        button.type = "button";
        button.textContent = promptText;
        button.addEventListener("click", () => {
          document.getElementById("prompt").value = promptText;
        });

        item.appendChild(button);
        historyList.appendChild(item);
      }
    }

    function savePrompt(promptText) {
      const history = getHistory().filter(item => item !== promptText);
      history.unshift(promptText);
      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history.slice(0, MAX_HISTORY))
      );
      renderHistory();
    }

    clearHistoryBtn.addEventListener("click", () => {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    });

    renderHistory();

    authBtn.href = authUrl.toString();

    // Read the API key returned in the URL fragment after authorization.
    const params = new URLSearchParams(window.location.hash.slice(1));
    const userKey = params.get("api_key");

    // Confirm whether a key was received without printing the key itself.
    console.log("API key received:", Boolean(userKey));
    console.log("Key length:", userKey?.length ?? 0);

    if (userKey) {
      authBtn.style.display = "none";
      promptSection.style.display = "block";

      // Remove the fragment from the address bar after reading the key.
      history.replaceState(
        null,
        "",
        window.location.pathname + window.location.search
      );
    }

    generateBtn.addEventListener("click", async (event) => {
      event.preventDefault();

      if (!userKey) {
        alert("Connect your Pollinations account first.");
        return;
      }

      const prompt = document.getElementById("prompt").value.trim();

      if (!prompt) {
        alert("Please enter a description.");
        return;
      }

      savePrompt(prompt);
      loading.style.display = "block";
      result.replaceChildren();

      try {
        const imageUrl =
          "https://gen.pollinations.ai/image/" +
          encodeURIComponent(prompt) +
          "?model=" +
          encodeURIComponent("lykon/dreamshaper-8-lcm");

        const response = await fetch(imageUrl, {
          headers: {
            Authorization: `Bearer ${userKey}`
          }
        });

        if (!response.ok) {
          const details = await response.text();
          console.error("Pollinations error:", response.status, details);
          throw new Error(`Pollinations returned HTTP ${response.status}`);
        }

        const imageBlob = await response.blob();
        const imageObjectUrl = URL.createObjectURL(imageBlob);
        const image = document.createElement("img");

        image.alt = "Generated image";
        image.src = imageObjectUrl;
        result.replaceChildren(image);
      } catch (error) {
        console.error(error);
        alert("Image generation failed. Check the browser console for details.");
      } finally {
        loading.style.display = "none";
      }
    });
  </script>
</body>
</html>
